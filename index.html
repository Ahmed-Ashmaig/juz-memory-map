<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuranFlow</title>
<meta name="description" content="Memorize the Quran surah by surah: sections on the real muṣḥaf pages, meanings, deeper explanations, self-tests and weak-spot practice.">
<meta name="theme-color" content="#F6F1E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QuranFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0}
img{max-width:100%}
@media (display-mode: standalone){.topbar{padding-top:calc(.65rem + env(safe-area-inset-top))}}
</style>
</head>
<body>

<style>
:root{
  --paper:#F6F1E4; --sheet:#FFFDF6; --ink:#1C1A17; --muted:#6B6453; --line:#E2D8C0; --gold:#8E6E33; --green:#0E5A45;
  --s1:#CFE5D8; --s2:#F0DDB2; --s3:#EDCFC4; --s4:#D3DCEA; --s5:#E3D5EC; --s6:#DCE7C6; --s7:#F2D8BD; --s8:#CDE3E6;
  --s1e:#3E8A68; --s2e:#A57F2F; --s3e:#A95D48; --s4e:#4D6D99; --s5e:#7D5A99; --s6e:#6E8A3A; --s7e:#B06A2C; --s8e:#3F8792;
  --hide:#E6DCC6; --focusw:#F5E3A6; --red:#B3261E; --redsoft:#F4D3CF; --rep:#6A3FB5; --repsoft:#ECE3FA;
  --ui:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --q:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12110D; --sheet:#1B1A15; --ink:#ECE5D2; --muted:#A89F8A; --line:#34302A; --gold:#CDAE72; --green:#72C3A0;
  --s1:#1F3B30; --s2:#3D3322; --s3:#402C27; --s4:#243042; --s5:#372C42; --s6:#2E3A22; --s7:#42301F; --s8:#203A3E;
  --s1e:#72C3A0; --s2e:#D8B46A; --s3e:#E0907A; --s4e:#8FB0DE; --s5e:#C3A2DC; --s6e:#B6D08A; --s7e:#E6A56A; --s8e:#86C9D2;
  --hide:#2C2922; --focusw:#5A4A1E; --red:#F08A80; --redsoft:#4A2521; --rep:#B89CF0; --repsoft:#33284A;
}}
:root[data-theme="dark"]{
  --paper:#12110D; --sheet:#1B1A15; --ink:#ECE5D2; --muted:#A89F8A; --line:#34302A; --gold:#CDAE72; --green:#72C3A0;
  --s1:#1F3B30; --s2:#3D3322; --s3:#402C27; --s4:#243042; --s5:#372C42; --s6:#2E3A22; --s7:#42301F; --s8:#203A3E;
  --s1e:#72C3A0; --s2e:#D8B46A; --s3e:#E0907A; --s4e:#8FB0DE; --s5e:#C3A2DC; --s6e:#B6D08A; --s7e:#E6A56A; --s8e:#86C9D2;
  --hide:#2C2922; --focusw:#5A4A1E; --red:#F08A80; --redsoft:#4A2521; --rep:#B89CF0; --repsoft:#33284A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--ui);padding-inline:clamp(16px,3vw,40px);padding-block:0 3rem;-webkit-text-size-adjust:100%}
.app{max-width:86rem;margin:0 auto;display:grid;gap:1.1rem;grid-template-columns:minmax(0,1fr)}
#surahBody,#juzList,.juzblock{grid-template-columns:minmax(0,1fr)}
button{font:inherit;color:inherit}
a{color:var(--green)}
p{margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.lbl{font:700 .74rem/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.src{font-size:.75rem;color:var(--muted)}
.red{color:var(--red)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:1rem 1.15rem;display:grid;gap:.5rem;align-content:start;min-width:0}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:.8rem;padding-block:.65rem;background:var(--paper);border-bottom:1px solid var(--line)}
.homebtn{display:inline-flex;align-items:center;gap:.45rem;flex:none;font:700 .95rem/1 var(--ui);color:var(--sheet);background:var(--green);border:1px solid var(--green);border-radius:999px;padding:.5rem .95rem;text-decoration:none;white-space:nowrap}
.homebtn svg{width:.95em;height:.95em;fill:currentColor}
.homebtn:hover{filter:brightness(1.12)}
/* on the home screen it marks where you are instead of being a button */
.homebtn.here{background:none;color:var(--ink);border-color:var(--line);pointer-events:none}
.homebtn.here svg{color:var(--green)}
.crumb{min-width:0;font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink)}
.navbtns{margin-inline-start:auto;display:flex;gap:.35rem}
.navbtns a{font-size:.85rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem;color:var(--ink);white-space:nowrap}
.navbtns{min-width:0;align-items:center}
.navbtns a,.navbtns .here{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtns .here{font-size:.88rem;font-weight:700;color:var(--ink);padding:.25rem .75rem;border-radius:999px;background:var(--sheet);border:1px solid var(--ink)}

/* ---- home ---- */
.homehead h1{margin:0;font:700 clamp(1.8rem,5vw,2.6rem)/1.05 var(--display);text-wrap:balance}
#home:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem;width:100%;max-width:50rem;margin-inline:auto}
.juzblock{display:grid;gap:.6rem}
.juzblock h2{margin:0;font:700 1.45rem/1.2 var(--display);display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.juzblock h2 .src{font-family:var(--ui);font-weight:400}
/* one surah per row, top to bottom in muṣḥaf order */
.chips{display:grid;grid-template-columns:minmax(0,1fr);background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chip{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;align-items:center;gap:.8rem;padding:.5rem 1rem .5rem .75rem;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);border-inline-start:4px solid transparent}
.chip:first-child{border-top:0}
.chip:hover{background:var(--paper)}
.chip .jn{font:700 1.05rem/1 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.chip .jtx{display:grid;gap:.1rem;min-width:0}
.chip .jen{font:700 1.02rem/1.25 var(--ui)}
.chip .jpg{font-size:.82rem;color:var(--muted)}
.chip .jar{font:400 1.45rem/1.9 var(--q);white-space:nowrap}
.chip .weak{font-weight:700;color:var(--red)}
.chip.pending{opacity:.45;pointer-events:none}
.chip.last{border-inline-start-color:var(--green);background:var(--paper)}
.chip.cont .jen{font-weight:500;font-style:italic;color:var(--muted)}
.soon{display:flex;align-items:baseline;flex-wrap:wrap;gap:.3rem .7rem;padding:.8rem 1rem;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.soon b{font:700 1.45rem/1.2 var(--display)}

/* ---- surah header ---- */
.head{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.head{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
h1.stitle{margin:0;font:700 clamp(1.7rem,4vw,2.6rem)/1.05 var(--display);display:flex;align-items:baseline;justify-content:center;gap:.55rem;flex-wrap:wrap;text-align:center}
/* the intro's name, summary line and main theme sit centred; the longer "why it was revealed" stays left for reading */
.intro .sub,.intro .themelbl,.intro .theme{text-align:center}
.intro .theme{margin-inline:auto}
h1.stitle .ar{font:400 .95em/1.2 var(--q);color:var(--green)}
.sub{color:var(--muted);font-size:.95rem}
.theme{font-size:1.06rem;max-width:62ch}
.why summary{cursor:pointer;font-weight:700;color:var(--green)}
.why p{max-width:64ch;margin-top:.55rem;line-height:1.6}
.quran-bar{position:relative;height:14px;border-radius:7px;background:var(--line);margin-block:.35rem .2rem}
.quran-bar i{position:absolute;inset-block:-4px;border-radius:4px;background:var(--green);min-width:6px}
.ends{display:flex;justify-content:space-between;gap:.5rem;font-size:.75rem;color:var(--muted)}
.neigh{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;font-size:.88rem}
.neigh .me{font-weight:700;color:var(--green);text-align:center;white-space:nowrap}
.neigh .r{text-align:end}
.neigh a{text-decoration:none}
.juzcard{gap:.6rem}
.jhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.3rem 1rem}
[hidden]{display:none!important}
.juzline-wrap{direction:rtl;overflow-x:auto;padding-bottom:.2rem;-webkit-overflow-scrolling:touch}
.juzline{direction:rtl;display:flex;gap:6px;padding-block:2px}
.js{min-width:5.6rem;display:grid;justify-items:center;align-content:start;gap:.05rem;padding:.5rem .3rem .45rem;border-radius:8px;background:var(--sheet);border:1px solid var(--line);border-top-width:4px;text-align:center;text-decoration:none;color:var(--ink)}
.js .jn{font:700 .78rem/1.2 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.js .jar{font:400 1.3rem/2.1 var(--q);margin-bottom:.15rem}
.js .jen{font:500 .8rem/1.2 var(--ui);direction:ltr}
.js .jpg{font-size:.7rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.js.me{background:var(--green);border-color:var(--green);border-top-color:var(--gold)}
a.js:hover{border-color:var(--gold)}
.js.me .jn,.js.me .jar,.js.me .jen,.js.me .jpg{color:var(--sheet)}

/* ---- modes + strip ---- */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem}
/* feature menu in the top bar: one part of the surah at a time */
.feat{position:relative;margin-inline-start:auto}
.feat:not([hidden]) + .navbtns{margin-inline-start:0}
.featbtn{display:inline-flex;align-items:center;gap:.5rem;font:700 .95rem/1 var(--ui);color:var(--ink);background:var(--sheet);border:1px solid var(--ink);border-radius:999px;padding:.5rem .9rem;cursor:pointer;white-space:nowrap}
.featbtn .caret{font-size:.8rem;transition:transform .15s}
.featbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.featmenu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:20;min-width:18rem;display:grid;gap:2px;padding:.35rem;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.featmenu button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:.1rem;padding:.6rem .75rem;border-radius:8px}
.featmenu button:hover,.featmenu button:focus-visible{background:var(--paper)}
.featmenu button[aria-current="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--green)}
.featmenu b{font-weight:700}
.featmenu span{font-size:.84rem;color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted)}
/* section list: every section down the side, top to bottom; the ones on the page in view stand out */
/* section strip: one row, section 1 on the right, later sections to the left (swipe left), like the muṣḥaf */
.strip{direction:rtl;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(9.5rem,1fr);gap:4px;overflow-x:auto;padding:3px 3px 7px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.blk{direction:ltr;border:0;border-radius:6px;padding:.5rem .55rem .45rem;cursor:pointer;text-align:center;display:grid;gap:.15rem;align-content:start;justify-items:center;min-width:0;border-bottom:4px solid transparent;transition:opacity .15s;scroll-snap-align:start}
.blk b{font-size:1.15rem;line-height:1.1}
.blk em{font-style:normal;font-size:.84rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.blk span{font-size:.72rem;color:var(--muted);white-space:nowrap}
.blk .weak{font-style:normal;font-size:.7rem;font-weight:700;color:var(--red)}
.blk:hover{filter:brightness(.96)}
.blk.right{outline:3px solid var(--green)} .blk.wrong{outline:3px solid var(--red)}
.b1{background:var(--s1)} .b2{background:var(--s2)} .b3{background:var(--s3)} .b4{background:var(--s4)}
.b5{background:var(--s5)} .b6{background:var(--s6)} .b7{background:var(--s7)} .b8{background:var(--s8)}
.blk.b1[aria-pressed="true"]{border-color:var(--s1e)} .blk.b2[aria-pressed="true"]{border-color:var(--s2e)}
.blk.b3[aria-pressed="true"]{border-color:var(--s3e)} .blk.b4[aria-pressed="true"]{border-color:var(--s4e)}
.blk.b5[aria-pressed="true"]{border-color:var(--s5e)} .blk.b6[aria-pressed="true"]{border-color:var(--s6e)}
.blk.b7[aria-pressed="true"]{border-color:var(--s7e)} .blk.b8[aria-pressed="true"]{border-color:var(--s8e)}

/* ---- muṣḥaf pages ---- */
/* The surah view is three groups: the intro, the sections with the pages, and the panel. On wide screens the
   groups dissolve into one grid; on phones each group is a screen the page snaps to. */
.stage{display:grid;gap:1.2rem;align-items:start;grid-template-columns:minmax(0,1fr)}
.screen{display:contents}
@media (min-width:1100px){
  /* the strip sits above the pages; "dense" lets the panel rise to the strip's row in the right-hand column */
  .stage{grid-template-columns:minmax(0,1fr) 25rem;grid-auto-flow:row dense}
  #sWhere,#sHead,#sBar{grid-column:1 / -1}
  .strip,.pagewrap,.deep{grid-column:1}
  .panel{grid-column:2;grid-row:span 3;align-self:start}
}
/* wide screens show two pages side by side, so a section that runs over a page break is all in view */
@media (min-width:1300px){.pagewrap .pages{grid-auto-columns:calc(50% - .4rem)}.pagewrap .page{scroll-snap-align:start}}
.pagewrap{display:grid;gap:.45rem;min-width:0}
.pagebar{display:grid;gap:.3rem}
.pips{direction:rtl;display:flex;gap:4px}
.pips button{flex:1;height:10px;border:0;border-radius:5px;background:var(--line);cursor:pointer;padding:0;min-width:0}
.pips button.on{background:var(--green)}
.pips button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.pagetxt{font-size:.8rem;color:var(--muted);text-align:center}
.pages{direction:rtl;display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.4rem;-webkit-overflow-scrolling:touch}
.page{direction:rtl;background:var(--sheet);border:1px solid var(--line);padding:.9rem .9rem .5rem;container-type:inline-size;scroll-snap-align:center;justify-self:center;width:100%;max-width:30rem}
.ln{display:flex;justify-content:space-between;align-items:center;white-space:nowrap;font:400 4.3cqi/2.15 var(--q);min-height:9.3cqi}
.ln.center{justify-content:center}
.w{padding-inline:.08em;border-radius:3px;cursor:pointer;transition:opacity .2s, background-color .2s, color .2s}
.w.s1{background:var(--s1)} .w.s2{background:var(--s2)} .w.s3{background:var(--s3)} .w.s4{background:var(--s4)}
.w.s5{background:var(--s5)} .w.s6{background:var(--s6)} .w.s7{background:var(--s7)} .w.s8{background:var(--s8)}
.w.o{opacity:.3;cursor:default}
.w.s.dim{opacity:.3;background:transparent}
.w.focus{background:var(--focusw)!important;opacity:1!important;box-shadow:0 0 0 1px var(--gold)}
.e{display:inline-flex;align-items:center;justify-content:center;min-width:1.35em;height:1.35em;border:1px solid var(--gold);border-radius:50%;font-size:.62em;line-height:1;color:var(--gold);padding-inline:.15em}
.name{border:1px solid var(--gold);border-radius:4px;padding-inline:1.2em;font-size:1.05em;color:var(--gold);line-height:1.6}
.pno{text-align:center;font:500 .8rem/1 var(--ui);color:var(--muted);padding-top:.35rem;direction:ltr}
.stage.test .w.sel:not(.shown){color:transparent;background:var(--hide)}
.stage.test .w.sel:not(.shown) .e{border-color:transparent;color:transparent}
.stage.quiz .w.s{background:transparent}
.w.stuck{color:var(--red);text-decoration:underline wavy var(--red);text-decoration-thickness:1px;text-underline-offset:.4em}
.w.stuck .e{border-color:var(--red);color:var(--red)}
.stage.test .w.sel.stuck:not(.shown){background:var(--redsoft);color:transparent;text-decoration:none}

/* ---- side panel ---- */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.15rem;display:grid;gap:.9rem;align-content:start;min-width:0}
@media (min-width:1100px){.panel{position:sticky;top:3.6rem;max-height:calc(100vh - 4.6rem);overflow:auto}}
.ptitle{font:700 1.45rem/1.2 var(--display);text-wrap:balance;margin:0}
.meaning{font-size:1rem}
.points{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;font-size:.92rem}
.points li{display:grid;grid-template-columns:3.4rem 1fr;gap:.5rem}
.points b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;white-space:nowrap}
.big-ar{font:400 1.6rem/2.05 var(--q);direction:rtl;text-align:right}
.mid-ar{font:400 1.2rem/1.9 var(--q);direction:rtl;text-align:right}
.tr{font-size:.92rem;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:.35rem}
.fact{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem;white-space:nowrap}
.fact.key{border-color:var(--gold);color:var(--gold);font-weight:700}
.nb{display:grid;gap:.6rem;direction:rtl}
.nb>*{direction:ltr}
@media (min-width:520px) and (max-width:1099px){.nb{grid-template-columns:1fr 1fr}}
.nbc{border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;display:grid;gap:.25rem;background:var(--paper);text-align:start;cursor:pointer;color:var(--ink);text-decoration:none}
.nbc:hover{border-color:var(--gold)}
.nbc .t{font-weight:700;font-size:.95rem}
.nbc .d{font-size:.85rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:.55rem .95rem;cursor:pointer;font-weight:500;touch-action:manipulation}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.stuckbtn{background:var(--red);border-color:var(--red);color:var(--sheet)}
.btn:disabled{opacity:.4;cursor:default}
/* Learn: previous / next ayah pinned to the bottom of the screen, whatever the scroll position */
.anav{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(40rem,calc(100% - 24px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.5rem;padding:.5rem;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.anav .btn{white-space:nowrap}
.anav-mid{display:grid;justify-items:center;gap:.2rem;min-width:0}
.anav-where{all:unset;cursor:pointer;font-size:.98rem;font-variant-numeric:tabular-nums;padding:0 .4rem;border-radius:6px;white-space:nowrap}
.anav-where:hover{background:var(--paper)}
.anav-mark{all:unset;cursor:pointer;font-size:.76rem;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:.1rem .55rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.anav-mark.on{background:var(--red);color:var(--sheet)}
.anav-view{all:unset;cursor:pointer;grid-column:1 / -1;justify-self:center;font-size:.78rem;font-weight:700;color:var(--red);padding:.1rem .6rem;border-radius:999px;text-decoration:underline;text-underline-offset:.2em}
.anav-view:hover{background:var(--redsoft)}
.anav-view:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn.okbtn{background:var(--green);border-color:var(--green);color:var(--sheet)}
.anav .btn.stuckbtn,.anav .btn.okbtn{font-weight:700}
.anav-where:focus-visible,.anav-mark:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* Learn panel tabs: the ayah, its section, or the sections around it */
.ltabs{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.ltabs button{flex:1;min-width:0;border:0;background:none;border-radius:999px;padding:.45rem .5rem;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.ltabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

/* opening, once per launch: a closed muṣḥaf settles in, its cover swings open, and the page reveals the
   basmala in Arabic, then in English, then the name. A tap skips it. */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--paper);animation:splashOut .6s ease 3.1s forwards;cursor:pointer}
.splash .book{position:relative;width:min(72vw,300px);aspect-ratio:4 / 5;perspective:1400px;animation:bookIn .6s cubic-bezier(.2,.7,.2,1) both;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.splash .leafp{position:absolute;inset:0;background:var(--sheet);border:1px solid var(--line);border-radius:4px 12px 12px 4px;display:grid;place-content:center;justify-items:center;gap:.55rem;text-align:center;padding:1.2rem 1.1rem;box-shadow:inset 10px 0 16px -12px rgba(0,0,0,.3)}
.splash .bism{font:400 clamp(1.25rem,5.4vw,1.7rem)/1.9 var(--q);color:var(--ink);direction:rtl;opacity:0;animation:fadeUp .8s ease 1.15s forwards}
.splash .bism-en{font:italic 400 .9rem/1.4 var(--ui);color:var(--muted);max-width:22ch;opacity:0;animation:fadeUp .7s ease 1.65s forwards}
.splash .rule{width:2.4rem;height:2px;background:var(--gold);border-radius:1px;opacity:0;animation:fadeUp .5s ease 2.05s forwards}
.splash .leafp b{font:700 clamp(1.2rem,5vw,1.5rem)/1.1 var(--display);color:var(--green);letter-spacing:.01em;opacity:0;animation:fadeUp .6s ease 2.2s forwards}
.splash .cover{position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--green) 88%,white) 0%,var(--green) 55%,color-mix(in srgb,var(--green) 80%,black) 100%);border:2px solid var(--gold);border-radius:4px 12px 12px 4px;transform-origin:left center;display:grid;place-content:center;justify-items:center;gap:.6rem;color:var(--gold);box-shadow:4px 6px 18px rgba(0,0,0,.25);animation:coverOpen 1.3s cubic-bezier(.55,0,.2,1) .55s forwards}
.splash .cover::before{content:"";position:absolute;inset:.7rem;border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);border-radius:3px 9px 9px 3px}
.splash .cover .mark{font:400 3.2rem/1 var(--q)}
.splash .cover .cname{font:700 1.05rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
@keyframes bookIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}

/* phones: the surah view is one scroller that snaps between three screens — the intro, the sections with
   the page, then the tabs. Only the scroller moves; the document itself stays put under the top bar. */
.scrollhint{display:none}

  body.in-surah{padding-bottom:0}
  body.in-surah #surah{padding-bottom:0}

  .stage{display:block;height:calc(100vh - var(--topbar,5.6rem) - .3rem - var(--bar,0px));height:calc(100dvh - var(--topbar,5.6rem) - .3rem - var(--bar,0px));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;overflow-anchor:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .stage::-webkit-scrollbar{display:none}

  #scr2 .blk b{font-size:.95rem}

/* section strip in Learn: what you're on stands out, the rest fades */
.blk.faded{opacity:.4}
.blk[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.btn.clearbtn{background:none;border-color:var(--red);color:var(--red);padding:.4rem .8rem;font-size:.9rem}
.btn.clearbtn.armed{background:var(--red);color:var(--sheet)}
/* ---- similars tab ---- */
.simlist{display:grid;gap:.4rem}
.simbtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:.1rem;padding:.45rem .6rem;border:1px solid var(--line);border-inline-start:3px solid var(--line);border-radius:6px;background:var(--paper)}
.simbtn.on{border-color:var(--rep);border-inline-start-color:var(--rep);background:var(--sheet)}
.simbtn:focus-visible{outline:2px solid var(--rep);outline-offset:2px}
.simbtn .d{font-size:.82rem;color:var(--muted)}
.simocc{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
.simcard{border:1px solid var(--line);border-radius:10px;padding:.8rem .95rem;display:grid;gap:.45rem;background:var(--sheet);min-width:0}
.simcard.here{border-inline-start:4px solid var(--rep)}
.simhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .8rem}
.simhead .d{font-size:.82rem;color:var(--muted)}
.simcue{font-weight:700;color:var(--rep)}
.simctx{display:grid;gap:.1rem;padding:.4rem .6rem;background:var(--paper);border-radius:6px}
.simctx .mid-ar{opacity:.85}
.simctx .k,.simmain .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.simmain{display:grid;gap:.1rem;padding:.3rem .2rem}
mark.simdiff{background:var(--repsoft);color:var(--rep);border-radius:3px;padding-inline:.1em;box-shadow:inset 0 -.15em 0 var(--rep)}
.stage.sim .w.s{background:transparent}
.w.simfocus{background:var(--repsoft)!important;color:var(--rep)}
/* "Before and after": the section before, this one, the one after */
.strio{display:grid;gap:.4rem}
.strio .nbc{opacity:.62}
.strio .nbc:hover{opacity:1}
.strio .here{display:grid;gap:.2rem;border:2px solid var(--gold);background:var(--sheet);border-radius:8px;padding:.65rem .8rem;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.strio .here .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700}
.strio .here .t{font-weight:700}
.strio .here .d{font-size:.88rem;color:var(--muted)}
</style>

<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  // When a new version takes over, reload once so the newest surahs and features show immediately.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
